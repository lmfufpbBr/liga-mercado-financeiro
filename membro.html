---
layout: default
---
<div class="member-card">
  <img class="avatar" src="{{ page.foto | default: '/assets/images/avatar-placeholder.svg' | relative_url }}" alt="Foto de {{ page.title }}">
  <div>
    <h1>{{ page.title }}</h1>
    <div class="role">{{ page.cargo }}{% if page.curso %} · {{ page.curso }}{% endif %}</div>
    <div class="post-content">
      {{ content }}
    </div>
    {% if page.redes %}
    <p class="meta">
      {% for rede in page.redes %}
        <a href="{{ rede[1] }}" target="_blank" rel="noopener">{{ rede[0] }}</a>{% unless forloop.last %} · {% endunless %}
      {% endfor %}
    </p>
    {% endif %}
  </div>
</div>
<p style="margin-top:32px;">
  <a href="{{ '/membros/' | relative_url }}">&larr; Voltar para Membros</a>
</p>
